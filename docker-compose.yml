services:
  db:
    image: pgvector/pgvector:pg16
    container_name: estimador-db
    environment:
      POSTGRES_USER: estimador
      POSTGRES_PASSWORD: estimador
      POSTGRES_DB: estimador
    ports:
      - "5433:5432"
    volumes:
      - estimador-db:/var/lib/postgresql/data
volumes:
  estimador-db:
